<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="900" viewBox="0 0 2000 900" role="img" aria-label="How carrydown works: ground truth, rendered document, plan and specs, GitHub issues, project board, developer skill"><defs><style>@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap');</style></defs><rect width="2000" height="900" fill="#FBF7F0"/><text x="100" y="80" font-size="40" font-weight="600" text-anchor="start" letter-spacing="0" style="fill:#1F2A44;font-family:'Inter','Helvetica Neue',Arial,sans-serif">How carrydown works</text><text x="100" y="122" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0" style="fill:#5B6472;font-family:'Inter','Helvetica Neue',Arial,sans-serif">Planning decisions stay with people. The skills set up, draft to templates, validate and populate.</text><rect x="100" y="190" width="560" height="118" rx="12" fill="#FFFFFF" stroke="#D9D4C7" stroke-width="1.6"/><text x="124" y="232" font-size="24" font-weight="600" text-anchor="start" letter-spacing="0" style="fill:#1F2A44;font-family:'Inter','Helvetica Neue',Arial,sans-serif">Your ground truth</text><text x="124" y="260" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0" style="fill:#5B6472;font-family:'Inter','Helvetica Neue',Arial,sans-serif">architecture, requirements, analyst notes,</text><text x="124" y="282" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0" style="fill:#5B6472;font-family:'Inter','Helvetica Neue',Arial,sans-serif">governance rules, development standards</text><text x="124" y="304" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0" style="fill:#5B6472;font-family:'Inter','Helvetica Neue',Arial,sans-serif">(.docx or .md)</text><circle cx="124" cy="172" r="14" fill="#E8A33D"/><text x="124" y="178" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="0" style="fill:#1F2A44;font-family: