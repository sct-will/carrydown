<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1040" viewBox="0 0 900 1040"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9" fill="none" stroke="#1F2A44" stroke-width="2"/></marker></defs><rect width="900" height="1040" fill="#FBF7F0"/><text x="42" y="62" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#1F2A44">The completed plan gets a second pass</text><text x="42" y="102" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#5B6472">The plan owner keeps the decisions. The agent supplies the challenge and</text><text x="42" y="133" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#5B6472">repair.</text><rect x="42" y="180" width="390" height="125" rx="18" fill="#FBEBD0" stroke="#9A6209" stroke-width="2"/><text x="65" y="218" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#9A6209">REVIEW BASIS</text><text x="65" y="258" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1F2A44">Ground truth and confirmed</text><text x="65" y="290" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1F2A44">constraints</text><rect x="468" y="180" width="390" height="125" rx="18" fill="white" stroke="#D9D4C7" stroke-width="2"/><text x="491" y="218" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#2A6F6F">COMPLETED ARTIFACTS</text><text x="491" y="258" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1F2A44">Plan, specifications and</text><text x="491" y="290" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1F2A44">checker report</text><path d="M237,305 L237,345" fill="none" stroke="#1F2A44" stroke-width="3" marker-end="url(#arrow)"/><path d="M663,305 L663,345" fill="none" stroke="#1F2A44" stroke-width="3" marker-end="url(#arrow)"/><rect x="42" y="355" width="816" height="195" rx="18" fill="#E6F0F0" stroke="#2A6F6F" stroke-width="2"/><text x="65" y="395" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#2A6F6F">1  SECOND-PASS AGENT REVIEW</text><text x="65" y="437" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#1F2A44">Challenge scope, people, dates, tracks, milestones,</text><text x="65" y="472" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#1F2A44">dependencies and handoffs.</text><text x="65" y="510" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#5B6472">Read the work as each engineer would experience it, including competing</text><text x="65" y="540" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#5B6472">demands.</text><path d="M450,550 L450,590" fill="none" stroke="#1F2A44" stroke-width="3" marker-end="url(#arrow)"/><rect x="42" y="600" width="816" height="190" rx="18" fill="white" stroke="#D9D4C7" stroke-width="2"/><text x="65" y="640" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#2A6F6F">2  SHOW THE REASONING</text><line x1="450" y1="662" x2="450" y2="750" stroke="#D9D4C7" stroke-width="2"/><text x="65" y="684" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#1F2A44">Coverage table</text><text x="65" y="722" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#5B6472">Requirement  •  Status</text><text x="65" y="752" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#5B6472">Work item  •  Evidence</text><text x="475" y="684" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#1F2A44">Findings table</text><text x="475" y="722" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#5B6472">Evidence  •  Reasoning  •  Risk</text><text x="475" y="752" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#5B6472">Confidence  •  Proposed repair</text><text x="65" y="780" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#2A6F6F">Nothing changes yet.</text><path d="M450,790 L450,830" fill="none" stroke="#1F2A44" stroke-width="3" marker-end="url(#arrow)"/><rect x="42" y="840" width="390" height="160" rx="18" fill="white" stroke="#D9D4C7" stroke-width="2"/><text x="65" y="880" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#2A6F6F">3  PLAN OWNER DECIDES</text><text x="65" y="925" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#1F2A44">Accept  •  Reject  •  Defer</text><text x="65" y="965" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#5B6472">Owners, dates, scope and order</text><text x="65" y="992" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#5B6472">stay human decisions.</text><path d="M432,920 L462,920" fill="none" stroke="#1F2A44" stroke-width="3" marker-end="url(#arrow)"/><rect x="468" y="840" width="390" height="160" rx="18" fill="#E6F0F0" stroke="#2A6F6F" stroke-width="2"/><text x="491" y="880" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#2A6F6F">4  REPAIR AND VERIFY</text><text x="491" y="925" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#1F2A44">Apply accepted findings</text><text x="491" y="965" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#5B6472">Update the plan and specs, rerun</text><text x="491" y="992" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#5B6472">checks, record remaining risk.</text></svg>