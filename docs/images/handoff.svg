<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="867" viewBox="0 0 1000 867" role="img" aria-label="Your artificial intelligence (AI) agent uses the carrydown skills to plan around team capacity and dependencies and draft a specification for each work item. Scripts check the specifications against the plan. You review and approve the work, then the agent creates GitHub epics, issues, a project board and the engineers' skill after dry runs. Engineers use that skill to start work from the specifications and cited architecture sections. An amber thread carries the architecture through each handoff.">
