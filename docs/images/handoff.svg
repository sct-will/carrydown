<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" role="img" aria-label="How carrydown works. Plan owner, an engineering or product manager: 1 Generate with carrydown-ground-truth, from the architecture document and the people and dates to plan.yaml and one spec per work item; 2 Review, no skill, read and edit the plan and specs with the agent; 3 Carry down to GitHub with carrydown-plan-to-github: epic, milestones, issues with specs, board and the engineers’ skill, then one install line. Engineers: 4 Work the issues, say Work on WI-03, the agent invokes the skill, reads the spec and the cited sections, then plans the code. The ground truth runs through steps 1 and 3 into step 4."><defs><style>@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap');</style></defs><defs><marker id="chev-ink" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="11" refY="6.0" orient="auto" overflow="visible"><path d="M1,1 L11,6.0 L1,11" fill="none" stroke="#1F2A44" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="chev-amber" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="11" refY="6.0" orient="auto" overflow="visible"><path d="M1,1 L11,6.0 L1,11" fill="none" stroke="#E8A33D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="chev-teal" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="11" refY="6.0" orient="auto" overflow="visible"><path d="M1,1 L11,6.0 L1,11" fill="none" stroke="#2A6F6F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="chev-muted" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="11" refY="6.0" orient="auto" overflow="visible"><path d="M1,1 L11,6.0 L1,11" fill="none" stroke="#5B6472" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><r