ext x="725.3" y="382.0" font-size="14" font-weight="600" text-anchor="start" style="fill:#2A6F6F;font-family:'Inter',sans-serif;font-size:14px;font-weight:600">Out</text><text x="725.3" y="409.0" font-size="15" font-weight="400" text-anchor="start" style="fill:#1F2A44;font-family:'Inter',sans-serif;font-size:15px;font-weight:400">epic, a sub-epic per</text><text x="725.3" y="430.0" font-size="15" font-weight="400" text-anchor="start" style="fill:#1F2A44;font-family:'Inter',sans-serif;font-size:15px;font-weight:400">milestone, issues with</text><text x="725.3" y="451.0" font-size="15" font-weight="400" text-anchor="start" style="fill:#1F2A44;font-family:'Inter',sans-serif;font-size:15px;font-weight:400">specs, board, engineers’</text><text x="725.3" y="472.0" font-size="15" font-weight="400" text-anchor="start" style="fill:#1F2A44;font-family:'Inter',sans-serif;font-size:15px;font-weight:400">skill</text><text x="725.3" y="503.0" font-size="15" font-weight="400" text-anchor="start" style="fill:#5B6472;font-family:'Inter',sans-serif;font-size:15px;font-weight:400">dry run first; nothing is</text><text x="725.3" y="524.0" font-size="15" font-weight="400" text-anchor="start" style="fill:#5B6472;font-family:'Inter',sans-serif;font-size:15px;font-weight:400">written until you say yes</text><path d="M390.66666666666663 387.8 H420.66666666666663" fill="none" stroke="#1F2A44" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#chev-ink)"/><path d="M671.3333333333333 387.8 H701.3333333333333" fill="none" stroke="#1F2A44" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#chev-ink)"/><path d="M793.3333333333333 571.6 V649.6" fill="none" stroke="#1F2A44" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#chev-ink)"/><text x="781.3" y="616.6" font-size="15" font-weight="600" text-anchor="end" style="fill:#2A6F6F;font-family:'Inter',sans-serif;font-size:15px;font-weight:600">one install line</text><rect x="426.7" y="655.6" width="521.3" height="185.0" rx