<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="824" viewBox="0 0 1000 824" role="img" aria-label="How carrydown works. Plan owner, an engineering or product manager: 1 Generate, the plan owner runs carrydown-ground-truth in their agent, from the architecture document and the people and dates to plan.yaml and one spec per work item; 2 Review, the plan and specs are human reviewed, with the agent making the edits; 3 Carry down to GitHub, the plan owner runs carrydown-plan-to-github in their agent: epic, a sub-epic per milestone, issues with specs, board and the engineers’ skill, then one install line. Engineers: 4 Work the issues, say Work on WI-03, the agent invokes the skill, reads the spec and the cited sections, then plans the code. The ground truth runs through steps 1 and 3 into step 4."><defs><style>@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap');</style></defs><defs><marker id="chev-ink" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="11" refY="6.0" orient="auto" overflow="visible"><path d="M1,1 L11,6.0 L1,11" fill="none" stroke="#1F2A44" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="chev-amber" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="11" refY="6.0" orient="auto" overflow="visible"><path d="M1,1 L11,6.0 L1,11" fill="none" stroke="#E8A33D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="chev-teal" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="11" refY="6.0" orient="auto" overflow="visible"><path d="M1,1 L11,6.0 L1,11" fill="none" stroke="#2A6F6F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="chev-muted" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="11" refY="6.0" orient="auto" overflow="visible"><path d="M1,1 L11,6.0 L1,11" fill="none" stroke="#5B6472" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1000" height="824" fill="#FBF7F0"/><text x="30.0" y="54.0" font-size="28" font-weight="600" text-anchor="start" style="fill:#1F2A44;font-family:'Inter',sans-serif;font-size:28px;font-weight:600">How carrydown works</text><text x="30.0" y="85.0" font-size="17" font-weight="400" text-anchor="start" style="fill:#5B6472;font-family:'Inter',sans-serif;font-size:17px;font-weight:400">Two skills you install, one skill is generated for your engineers.</text><rect x="30.0" y="112.0" width="940.0" height="413.6" rx="14" fill="#F3EFE6"/><rect x="30.0" y="543.6" width="940.0" height="255.0" rx="14" fill="#E6F0F0"/><text x="52.0" y="146.0" font-size="14" font-weight="700" text-anchor="start" letter-spacing="1.5" style="fill:#2A6F6F;font-family:'Inter',sans-serif;font-size:14px;font-weight:700">PLAN OWNER</text><text x="175.8" y="146.0" font-size="15" font-weight="400" text-anchor="start" style="fill:#5B6472;font-family:'Inter',sans-serif;font-size:15px;font-weight:400">engineering or product manager</text><text x="52.0" y="577.6" font-size="14" font-weight="700" text-anchor="start" letter-spacing="1.5" style="fill:#2A6F6F;font-family:'Inter',sans-serif;font-size:14px;font-weight:700">ENGINEERS</text><g data-gt="1"><path d="M54.0 204.0 H93.0 L104.0 215.0 V268.0 H54.0 Z" fill="#FBEBD0" stroke="#E8A33D" stroke-width="2"/><path d="M93.0 204.0 V215.0 H104.0" fill="none" stroke="#E8A33D" stroke-width="2"/><line x1="63.0" y1="223.2" x2="95.0" y2="223.2" stroke="#1F2A44" stroke-width="1.6" opacity="0.5"/><line x1="63.0" y1="233.4" x2="87.5" y2="233.4" stroke="#1F2A44" stroke-width="1.6" opacity="0.5"/><line x1="63.0" y1="243.7" x2="95.0" y2="243.7" stroke="#1F2A44" stroke-width="1.6" opacity="0.5"/><line x1="63.0" y1="253.9" x2="87.5" y2="253.9" stroke="#1F2A44" stroke-width="1.6" opacity="0.5"/><text x="79.0" y="294.0" font-size="14" font-weight="600" text-anchor="middle" style="fill:#1F