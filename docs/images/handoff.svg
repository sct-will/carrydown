<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="892" viewBox="0 0 1000 892" role="img" aria-label="How carrydown works. Plan owner, an engineering or product manager: 1 Generate, the plan owner runs carrydown-ground-truth in their agent, from a context folder with DOCX, PDF, TXT and PNG files and optional team availability, skills and preferences to best-match tracks, plan.yaml and one spec per work item; 2 Challenge and repair, a second-pass agent review challenges scope, staffing choices, dates, tracks, milestones and dependencies, produces coverage and risk tables, and the plan owner decides which findings the agent repairs; 3 Carry down to GitHub, the plan owner runs carrydown-plan-to-github in their agent: epic, a sub-epic per milestone, issues with specs, board and the engineers’ skill, after a dry run, with nothing written until you say yes, then one install line. Engineers: 4 Start a work item, say Work on [work item ID], the agent invokes the skill, reads the spec and the cited sections, then plans the code. The ground truth runs through steps 1 and 3 into step 4, on a thread labeled agreed context, cited by section."><defs><style>@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap');</style></defs><defs><marker id="chev-ink" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="11" refY="6.0" orient="auto" overflow="visible"><path d="M1,1 L11,6.0 L1,11" fill="none" stroke="#1F2A44" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="chev-amber" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="11" refY="6.0" orient="auto" overflow="visible"><path d="M1,1 L11,6.0 L1,11" fill="none" stroke="#E8A33D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="chev-teal" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="11" refY="6.0" orient="auto" overflow="visible"><path d="M1,1 L11,6.0 L1,11" fill="none" stroke="#2A6F6F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="chev-muted" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="11" refY="6.0" orient="auto" overflow="visible"><path d="M1,1 L11,6.0 L1,11" fill="none" stroke="#5B6472" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1000" height="892" fill="#FBF7F0"/><text x="30.0" y="54.0" font-size="28" font-weight="600" text-anchor="start" style="fill:#1F2A44;font-family:'Inter',sans-serif;font-size:28px;font-weight:600">How carrydown works</text><text x="30.0" y="85.0" font-size="17" font-weight="400" text-anchor="start" style="fill:#5B6472;font-family:'Inter',sans-serif;font-size:17px;font-weight:400">Two skills you install, one skill is generated for your engineers.</text><rect x="30.0" y="112.0" width="940.0" height="481.6" rx="14" fill="#F3EFE6"/><rect x="30.0" y="611.6" width="940.0" height="255.0" rx="14" fill="#E6F0F0"/><text x="52.0" y="146.0" font-size="14" font-weight="700" text-anchor="start" letter-spacing="1.5" style="fill:#2A6F6F;font-family:'Inter',sans-serif;font-size:14px;font-weight:700">PLAN OWNER</text><text x="175.8" y="146.0" font-size="15" font-weight="400" text-anchor="start" style="fill:#5B6472;font-family:'Inter',sans-serif;font-size:15px;font-weight:400">engineering or product manager</text><text x="52.0" y="645.6" font-size="14" font-weight="700" text-anchor="start" letter-spacing="1.5" style="fill:#2A6F6F;font-family:'Inter',sans-serif;font-size:14px;font-weight:700">ENGINEERS</text><g data-gt="1"><path d="M30 235 H74.72 L82.72 243 H134 V307 H30 Z" fill="#FBEBD0" stroke="#E8A33D" stroke-width="2"/><rect x="35.0" y="247.0" width="45.5" height="26.0" rx="2" fill="#FFFFFF" stroke="#E8A33D" stroke-width="1"/><text x="57.8" y="264.8" font-size="14" font-weight="700" text-anchor="middle" style="fill:#9A6209;font-family:'Inter',sans-serif;font-size:14px;font-weight:700">DOCX</text><rect x="83.5" y="247.0" width="45.5" height="26.0" rx="2" fill="#FFFFFF" stroke="#E8A33D" stroke-width="1"/><text x="106.2" y="264.8" font-size="14" font-weight="700" text-anchor="middle" style="fill:#9A6209;font-family:'Inter',sans-serif;font-size:14px;font-weight:700">PDF</text><rect x="35.0" y="276.0" width="45.5" height="26.0" rx="2" fill="#FFFFFF" stroke="#E8A33D" stroke-width="1"/><text x="57.8" y="293.8" font-size="14" font-weight="700" text-anchor="middle" style="fill:#9A6209;font-family:'Inter',sans-serif;font-size:14px;font-weight:700">TXT</text><rect x="83.5" y="276.0" width="45.5" height="26.0" rx="2" fill="#FFFFFF" stroke="#E8A33D" stroke-width="1"/><text x="106.2" y="293.8" font-size="14" font-weight="700" text-anchor="middle" style="fill:#9A6209;font-family:'Inter',sans-serif;font-size:14px;font-weight:700">PNG</text><text x="82.0" y="334.0" font-size="14" font-weight="600" text-anchor="middle" style="fill:#1F2A44;font-family:'Inter',sans-serif;font-size:14px;font-weight:600">context folder</text><path d="M138 266.0 H176.0 M342.66666666666663 238 V168 H903.9999999999999 V238 M903.9999999999999 557.6 V651.6" fill="none" stroke="#E8A33D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chev-amber)"/><circle cx="146.0" cy="266.0" r="3.6" fill="#E8A33D"/><circle cx="342.7" cy="208.0" r="3.6" fill="#E8A33D"/><circle cx="904.0" cy="208.0" r="3.6" fill="#E8A33D"/><circle cx="904.0" cy="567.6" r="3.6" fill="#E8A33D"/><rect x="424.4" y="152.0" width="245.3" height="32.0" rx="16.0" fill="#FFFFFF" stroke="#E8A33D" stroke-width="1.6"/><text x="547.0" y="173.0" font-size="14" font-weight="600" text-anchor="middle" style="fill:#9A6209;font-family:'Inter',sans-serif;font-size:14px;font-weight:600">agreed context, cited by section</text></g><rect x="146.0" y="208.0" width="240.7" height="359.6" rx="12" fill="#FFFFFF" stroke="#D9D4C7" stroke-width="1.5"/><circle cx="172.0" cy="208" r="16" fill="#1F2A44"/><text x="172.0" y="213.4" font-size="15" font-weight="700" text-anchor="middle" class="straddle" style="fill:#FFFFFF;font-family:'Inter',sans-serif;font-size:15px;font-weight:700">1</text><text x="164.0" y="253.0" font-size="19" font-weight="600" text-anchor="start" style="fill:#1F2A44;font-family:'Inter',sans-serif;font-size:19px;font-weight:600">Generate</text><rect x="164.0" y="284.0" width="193.8" height="72.0" rx="16" fill="#E6F0F0" stroke="#3C8C8C" stroke-width="1.3"/><text x="176.0" y="305.0" font-size="14" font-weight="500" text-anchor="start" style="fill:#2A6F6F;font-family:'Inter',sans-serif;font-size:14px;font-weight:500">plan owner runs</text><text x="176.0" y="325.0" font-size="14" font-weight="700" text-anchor="start" style="fill:#2A6F6F;font-family:'Inter',sans-serif;font-size:14px;font-weight:700">carrydown-ground-truth</text><text x="176.0" y="345.0" font-size="14" font-weight="500" text-anchor="start" style="fill:#2A6F6F;font-family:'Inter',sans-serif;font-size:14px;font-weight:500">in their agent</text><text x="164.0" y="382.0" font-size="14" font-weight="600" text-anchor="start" style="fill:#2A6F6F;font-family:'Inter',sans-serif;font-size:14px;font-weight:600">In</text><text x="164.0" y="409.0" font-size="15" font-weight="400" text-anchor="start" style="fill:#1F2A44;font-family:'Inter',sans-serif;font-size:15px;font-weight:400">context folder + team</text><text x="164.0" y="430.0" font-size="15" font-weight="400" text-anchor="start" style="fill:#1F2A44;font-family:'Inter',sans-serif;font-size:15px;font-weight:400">availability, skills and</text><text x="164.0" y="451.0" font-size="15" font-weight="400" text-anchor="start" style="fill:#1F2A44;font-family:'Inter',sans-serif;font-size:15px;font-weight:400">preferences</text><text x="164.0" y="480.6" font-size="14" font-weight="600" text-anchor="start" style="fill:#2A6F6F;font-family:'Inter',sans-serif;font-size:14px;font-weight:600">Out</text><text x="164.0" y="507.6" font-size="15" font-weight="400" text-anchor="start" style="fill:#1F2A44;font-family:'Inter',sans-serif;font-size:15px;font-weight:400">best-match tracks,</text><text x="164.0" y="528.6" font-size="15" font-weight="400" text-anchor="start" style="fill:#1F2A44;font-family:'Inter',sans-serif;font-size:15px;font-weight:400">plan.yaml and one spec per</text><text x="164.0" y="549.6" font-size="15" font-weight="400" text-anchor="start" style="fill:#1F2A44;font-family:'Inter',sans-serif;font-size:15px;font-weight:400">work item</text><rect x="426.7" y="208.0" width="240.7" height="359.6" rx="12" fill="#FFFFFF" stroke="#D9D4C7" stroke-width="1.5"/><circle cx="452.66666666666663" cy="208" r="16" fill="#1F2A44"/><text x="452.7" y="213.4" font-size="15" font-weight="700" text-anchor="middle" class="straddle" style="fill:#FFFFFF;font-family:'Inter',sans-serif;font-size:15px;font-weight:700">2</text><text x="444.7" y="253.0" font-size="19" font-weight="600" text-anchor="start" style="fill:#1F2A44;font-family:'Inter',sans-serif;font-size:19px;font-weight:600">Challenge and repair</text><text x="444.7" y="305.0" font-size="15" font-weight="400" text-anchor="start" style="fill:#5B6472;font-family:'Inter',sans-serif;font-size:15px;font-weight:400">second-pass agent review</text><text x="444.7" y="326.0" font-size="15" font-weight="400" text-anchor="start" style="fill:#5B6472;font-family:'Inter',sans-serif;font-size:15px;font-weight:400">challenges scope, staffing</text><text x="444.7" y="347.0" font-size="15" font-weight="400" text-anchor="start" style="fill:#5B6472;font-family:'Inter',sans-serif;font-size:15px;font-weight:400">choices, dates, tracks,</text><text x="444.7" y="368.0" font-size="15" font-weight="400" text-anchor="start" style="fill:#5B6472;font-family:'Inter',sans-serif;font-size:15px;font-weight:400">milestones and</text><text x="444.7" y="389.0" font-size="15" font-weight="400" text-anchor="start" style="fill:#5B6472;font-family:'Inter',sans-serif;font-size:15px;font-weight:400"