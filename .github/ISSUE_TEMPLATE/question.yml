name: Question
description: Ask how to use the carrydown skills.
title: "Question: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Read [START-HERE.md](https://github.com/sct-will/carrydown/blob/main/START-HERE.md) and the [FAQ](https://github.com/sct-will/carrydown/blob/main/docs/faq.md) first. They answer most questions.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: dropdown
    id: skill
    attributes:
      label: Which skill or other part
      options:
        - carrydown-ground-truth
        - carrydown-plan-to-github
        - The generated engineers' skill
        - A script run by hand
        - The sample
        - Not sure
  - type: input
    id: agent
    attributes:
      label: Which coding agent you use
  - type: textarea
    id: tried
    attributes:
      label: What you tried
      description: Include the command you ran, with your token and private paths removed.
      render: text
