# Lints the prose of the repository: no em or en dashes, no credit lines, and no AI vendor
# names outside the install instructions. The same command runs on your computer:
#   python3 scripts/lint_prose.py
name: Prose lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Lint the prose
        run: python3 scripts/lint_prose.py
