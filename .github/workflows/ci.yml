# Runs the self test of the carrydown skills on every push and pull request. No token and no network
# access to GitHub are needed. The self test checks the sample against its plan, runs
# every script's --help, and runs every dry run against the sample.
name: Self test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run the self test
        run: python scripts/selftest.py
      - name: Run recovery regression tests
        run: python -m unittest discover -s tests -v
      - name: Check prose and packaged assets
        run: |
          python scripts/lint_prose.py
          python scripts/sync_skill_assets.py --check
          python scripts/check_specs.py --root sample/expense-approvals --report
