# Runs the self test of the carrydown skills on every push to main and every pull request. No token and no network
# access to GitHub are needed. The self test checks the sample against its plan, runs
# every script's --help, and runs every dry run against the sample.
#
# Two more kinds of job run on the same events, all with fake time and a fake GitHub (work package 11):
#   scenarios   Scenario A (the "yes" path), Scenario B (the "no" path) and the shared lifecycle and adversarial
#               continuation, one line per numbered step of the specification, about a minute and a half.
#   negative    the six negative tests of Part G, one job each, so the checks list G1 to G6 separately.
# The real GitHub acceptance run of work package 7 is not here: it needs a test organization and the owner's say-so.
name: Self test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run the self test
        run: python scripts/selftest.py
      - name: Run recovery regression tests
        run: python -m unittest discover -s tests -v
      - name: Check prose and packaged assets
        run: |
          python scripts/lint_prose.py
          python scripts/sync_skill_assets.py --check
          python scripts/check_specs.py --root sample/expense-approvals --report

  scenarios:
    name: Acceptance scenarios (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Scenario A, Scenario B and the shared lifecycle
        run: python tests/scenario_embedded_release.py

  negative:
    name: Negative test ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        group: ["G1", "G2", "G3", "G4", "G5", "G6"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
      - name: ${{ matrix.group }}
        run: python tests/test_negative_release.py ${{ matrix.group }}
