# Runs the self test of the carrydown skills on every push and pull request. No token and no network
# access to GitHub are needed. The self test checks the sample against its plan, runs
# every script's --help, and runs every dry run against the sample.
name: Self test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run the self test
        run: python3 scripts/selftest.py
