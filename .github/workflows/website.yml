# Builds, tests and deploys the carried-context.dev website to GitHub Pages.
#
# The only credential is the built-in GITHUB_TOKEN. No secret is read.
#
# The website branch trigger below is removed after the merge to main.
name: Website

on:
  push:
    branches: [main, website]
    paths:
      - "website/**"
      - "docs/**"
      - "README.md"
      - "sample/expense-approvals/README.md"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A newer push waits for the running deploy instead of canceling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install the browser for the tests and the social image
        run: npx playwright install --with-deps chromium
      - name: Check that the docs match the repository Markdown
        run: node scripts/check-docs-sync.mjs
      - name: Type check
        run: npx astro check
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Upload the reflow screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reflow-screenshots
          path: website/tests/screenshots
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the site for Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # enablement: true asks Pages to switch itself on when the repository has not enabled it yet.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
