# Deploys the carriedcontext.dev website to GitHub Pages on a push to main. The build and the tests are in
# website-build.yml, which this workflow calls first and which ci.yml calls on a pull request without deploying.
#
# The only credential is the built-in GITHUB_TOKEN. No secret is read.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "README.md"
      - "sample/expense-approvals/README.md"
      - "sample/expense-approvals/images/**"
      - ".github/workflows/website.yml"
      - ".github/workflows/website-build.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A newer push waits for the running deploy instead of canceling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/website-build.yml
    with:
      upload_pages: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # enablement: true asks Pages to switch itself on, but only a token with admin rights can do that.
      # The built-in token cannot, so turn Pages on once in Settings, Pages, Source: GitHub Actions,
      # before the first deploy.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
