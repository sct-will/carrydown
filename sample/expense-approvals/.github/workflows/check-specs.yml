# Runs the carrydown checks on every pull request and on pushes to the default branch.
# Two checks run. The full check reads plan.yaml, the specifications and the approved context.
# It runs when a pull request changes a governed path, and on pushes that change one. The
# declaration check reads the pull request description and runs on every pull request, so a
# code-only pull request gets a result too. Neither check calls a model. A failed check fails
# the job, and so blocks the merge when branch protection requires it. The same commands run
# on your computer:
#   python3 tools/carrydown/check_specs.py --root .
#   python3 tools/carrydown/check_specs.py --root . --pull-request-body body.txt
# A declaration proves what was declared and checked. It does not prove that the code meets
# every requirement.
name: Check specifications

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "docs/spec/**"
      - "docs/ground-truth/**"
      - "docs/context/**"
      - "docs/release/**"
      - "tools/carrydown/**"
  # merge_group:
  #   Enable the merge_group event above when the repository uses a merge queue. See the GitHub workflow event reference.

permissions:
  contents: read

jobs:
  check-specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Find out whether a governed path changed
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Only a pull request can touch no governed path. Any other event runs the full check.
          governed=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            governed=false
            if changed=$(git diff --name-only "$BASE_SHA" HEAD); then
              while IFS= read -r file; do
                case "$file" in
                  "docs/spec"/*|"docs/ground-truth"/*|docs/context/*|docs/release/*|tools/carrydown/*) governed=true ;;
                esac
              done <<< "$changed"
            else
              governed=true
            fi
          fi
          echo "governed=$governed" >> "$GITHUB_OUTPUT"
      - name: Check the specifications against the plan
        if: steps.scope.outputs.governed == 'true'
        run: python3 tools/carrydown/check_specs.py --root .
      - name: Check the pull request declaration
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          PR_BODY_FILE="$RUNNER_TEMP/pull-request-body.txt"
          printf '%s' "$PR_BODY" > "$PR_BODY_FILE"
          python3 tools/carrydown/check_specs.py --root . --pull-request-body "$PR_BODY_FILE" --branch "$PR_BRANCH"
