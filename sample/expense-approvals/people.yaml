# Sample input: who does the work. The interview in the ground-truth skill collects these.
# All names are fictional. The ids match the ids in docs/spec/plan.yaml.
#
# In a real project this file lives in the private workspace (workspace.py init creates it) and
# never in the repository. The sample keeps a fictional copy here so the checker can show the
# capacity, dates and names checks. Pass it explicitly, as a real project's workspace copy is
# found by the pointer in .carrydown/local.yaml:
#   python3 scripts/check_specs.py --root sample/expense-approvals --report --people sample/expense-approvals/people.yaml
people:
