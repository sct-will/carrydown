    name: "Tamsin Hale"
    github: ""                     # GitHub login for issue assignment. Empty in the sample.
    track: Workflow                # the lane this person owns
    skills: ["Python services", "PostgreSQL", "Workflow design"]
    preferences: ["Service contracts", "Policy enforcement"]
    assignment_rationale: "The workflow track best matches the supplied service, data and workflow skills and the preference for policy work."
    allocation: 100                # percent of working time on this plan
    start: 2027-02-01
    days_off: [2027-02-22]
  - id: idris
    name: "Idris Okoye"
    github: ""
    track: Experience
    skills: ["TypeScript", "Accessible web interfaces", "Notification flows"]
    preferences: ["User-facing workflows", "Integration demonstrations"]
    assignment_rationale: "The experience track best matches the supplied interface and notification skills and the preference for user-facing work."
